meters:
- name: seats
  description: Active users in the organization - the primary billing unit across all plan tiers.
  unit: users
  aggregation: max
  dimensions:
  - organization
  - plan_tier
- name: add_on_seats
  description: Per-user add-ons (Insights, Tasks, Locations, Silent App, More Screenshots, Data Retention) billed on top of the base plan.
  unit: users
  aggregation: max
  dimensions:
  - organization
  - add_on
- name: api_requests
  description: API v2 requests - not billed, but capped at 1,000 per hour per application; a scarcity budget rather than a cost meter.
  unit: requests
  aggregation: sum
  dimensions:
  - application
  - user
principles:
- name: Visibility
  description: Track occupied seats against paid seats per organization; the billing.occupied_seats webhook event and GET /v2/organizations/{id}/seats give a programmatic seat snapshot for reconciliation.
- name: Allocation
  description: Map organizations, teams, and projects to internal cost centers so per-seat spend and tracked time roll up to the right budget owners.
- name: Optimization
  description: Right-size the plan tier against feature use (screenshots, integrations, payroll), prefer annual billing for the discount, remove inactive members promptly, and prefer add-ons over a blanket tier upgrade when only one capability is needed.
- name: Accountability
  description: Review seat counts and add-on usage monthly; assign an owner for the Hubstaff subscription and for each OAuth app consuming the API budget.
