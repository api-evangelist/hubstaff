description: >-
  FinOps view of Hubstaff spend. Hubstaff is a per-seat SaaS subscription -
  cost scales with the number of users in the organization, not with API call
  volume. Paid tiers run from $4.99 (Starter) to $10.00 (Team) per user per
  month billed annually, with Enterprise listed at $25.00 per user per month,
  a two-seat minimum on paid plans, and optional per-user add-ons (Insights,
  Tasks, Locations, Silent App, More Screenshots, Data Retention) layered on
  top. The API itself carries no separate fee or metered billing - it is
  bounded by the 1,000 requests/hour per-app rate limit rather than by spend.
notes: >-
  The primary cost levers are seat count, plan tier, billing cadence (annual
  vs monthly saves roughly 17-33%), and add-ons. Verify current rates at
  hubstaff.com/pricing during reconciliation.
