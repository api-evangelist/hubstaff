sources:
  - url: https://api.hubstaff.com/v2/docs
    type: OpenAPI
    note: Live Swagger 2.0 definition (124 paths, schemes https only). OAuth2 accessCode flow via account.hubstaff.com; no WebSocket or SSE anywhere in the document.
  - url: https://developer.hubstaff.com/
    type: Documentation
    note: Hubstaff Developer Portal - public API documentation, personal access tokens, and app registration.
  - url: https://developer.hubstaff.com/docs/hubstaff_v2
    type: APIReference
    note: Interactive API v2 reference rendered from the live definition.
  - url: https://support.hubstaff.com/time-tracking-api/
    type: Documentation
    note: Confirms v1 deprecated / v2 current, OpenID Connect + personal access tokens (90-day refresh tokens), 1,000 requests/hour per app, 30-second request timeout, HTTPS required.
actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists. Hubstaff's own public API is
    request/response REST over HTTPS; its push mechanism is webhooks
    (HTTP callbacks to consumer endpoints), which carry no server-push
    transport on Hubstaff's API to model in AsyncAPI, and the activity
    "updates" endpoints are polling surfaces. No AsyncAPI document was
    created.
