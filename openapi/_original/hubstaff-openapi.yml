    post:
      operationId: postV2OrganizationsOrganizationIdWebhooks
      tags:
      - Webhooks
      summary: Create organization webhook
      description: 'Creates a new webhook subscription for the organization. After creation, Hubstaff
        will send a POST request to your `target_url` with an empty body and an `X-Hook-Secret` header.


        Your endpoint must respond with HTTP 200 and echo the same `X-Hook-Secret` header to verify ownership.


        Store the secret value - you''ll need it to activate the webhook.'
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Request payload. See the live Hubstaff API reference (https://api.hubstaff.com/v2/docs)
                for the full schema.
      responses:
        '201':
          description: Create organization webhook
        '429':
          description: Rate limit exceeded (1,000 requests per hour per application).
