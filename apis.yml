    type: APIReference
  - url: openapi/hubstaff-openapi.yml
    type: OpenAPI
  description: Create time entries for users, list organization timesheets (aggregate
    approval records), move timesheets through the open, submitted, approved, and
    denied statuses, and audit manual time edits via time edit logs.
