aid: hubstaff
url: https://raw.githubusercontent.com/api-evangelist/hubstaff/refs/heads/main/apis.yml
name: Hubstaff
kind: company
description: Hubstaff is a time tracking and workforce analytics platform for remote,
  hybrid, and field teams. The Hubstaff API v2 provides read and write access to
  tracked time (10-minute activity blocks and daily aggregates), time entries,
  timesheets and approvals, time off, attendance schedules and shifts, organizations,
  members, teams, projects, tasks, clients, invoices, team payments, screenshots,
  app and URL usage, and webhooks - authenticated with OAuth 2.0 / OpenID Connect
  or personal access tokens.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Time Tracking
- Timesheets
- Workforce Management
- Productivity
- Employee Monitoring
- Project Management
- Payroll
created: '2026-07-11'
modified: '2026-07-11'
specificationVersion: '0.19'
apis:
- aid: hubstaff:hubstaff-activities-time-tracking-api
  name: Hubstaff Activities and Time Tracking API
  tags:
  - Time Tracking
  - Activities
  - Productivity
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.hubstaff.com/docs/hubstaff_v2
  baseURL: https://api.hubstaff.com/v2
  properties:
  - url: https://developer.hubstaff.com/docs/hubstaff_v2
    type: APIReference
  - url: https://support.hubstaff.com/time-tracking-api/
    type: Documentation
  - url: openapi/hubstaff-openapi.yml
    type: OpenAPI
  description: Tracked time as 10-minute activity blocks with keyboard and mouse
    activity percentages, pre-aggregated daily activities, and the most recent
    activity per member - filterable by user, project, task, and time range at
    both the organization and project level.
- aid: hubstaff:hubstaff-timesheets-time-entries-api
  name: Hubstaff Timesheets and Time Entries API
  tags:
