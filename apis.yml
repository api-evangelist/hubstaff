name: Hubstaff
kind: company
description: Hubstaff is a time tracking and workforce analytics platform for remote,
  hybrid, and field teams. The Hubstaff API v2 provides read and write access to
  tracked time (10-minute activity blocks and daily aggregates), time entries,
  timesheets and approvals, time off, attendance schedules and shifts, organizations,
  members, teams, projects, tasks, clients, invoices, team payments, screenshots,
  app and URL usage, and webhooks - authenticated with OAuth 2.0 / OpenID Connect
  or personal access tokens.
accessModel:
  pricing: freemium
  onboarding: open
  trial: true
  try_now: true
  public: true
  label: Freemium (free trial) · Open access
  confidence: high
